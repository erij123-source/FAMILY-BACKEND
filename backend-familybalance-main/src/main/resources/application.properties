spring.application.name=BackEnd

# Database — Angular variant used "familybalance" while mobile used
# "family_balance". Keep the Angular name as the canonical one since this
# directory tree is the merged backend. Override via env vars if needed.
spring.datasource.url=jdbc:mysql://localhost:3306/familybalance
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.id.new_generator_mappings=true
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=false

# JWT
jwt.secret=tRbUdL0TL8gB5Olo2z3EL5p+0Vh7X8M6JzETPl5628y698YoNzQplvet2EPWjeRA
jwt.expiration=900000
jwt.refresh.expiration=604800000
app.jwt.refreshTokenExpiration=604800000

# Error reporting (preserved from both projects)
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-exception=true
server.error.include-stacktrace=on_param

# Multipart uploads (Angular facture/photo upload flows)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

